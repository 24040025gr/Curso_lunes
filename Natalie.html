<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natalie Landero</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Mi CSS -->
    <style>
        /* ===== Paleta y base ===== */
        :root {
            --rosa: #ffd6e8;
            --lila: #e8d6ff;
            --morado: #6a4c93;
            --rosa-fuerte: #ff8fab;
            --blanco: #fffafc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--lila), var(--rosa));
            overflow: hidden;
            position: relative;
        }

        /* ===== Tarjeta principal ===== */
        .card {
            background: var(--blanco);
            border-radius: 24px;
            padding: 48px 56px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(106, 76, 147, 0.25);
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 2;
            border: 3px solid var(--rosa-fuerte);
        }

        .gatito {
            font-size: 4rem;
            margin-bottom: 8px;
            animation: rebote 2.5s ease-in-out infinite;
        }

        h1 {
            color: var(--morado);
            font-size: 2.2rem;
            margin: 0 0 12px;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.5;
            margin: 6px 0;
        }

        /* ===== Decoraciones flotantes ===== */
        .gato,
        .estrella {
            position: absolute;
            font-size: 2rem;
            opacity: 0.8;
            z-index: 1;
            animation: flotar 6s ease-in-out infinite;
        }

        .gato1 { top: 10%; left: 8%; font-size: 2.5rem; animation-delay: 0s; }
        .gato2 { bottom: 12%; right: 10%; font-size: 3rem; animation-delay: 1.5s; }
        .gato3 { top: 18%; right: 14%; font-size: 2rem; animation-delay: 3s; }

        .estrella {
            color: var(--rosa-fuerte);
            animation-name: brillar;
        }

        .estrella1 { top: 6%; right: 30%; font-size: 1.8rem; animation-delay: 0.5s; }
        .estrella2 { bottom: 8%; left: 15%; font-size: 1.5rem; animation-delay: 2s; }
        .estrella3 { top: 45%; left: 5%; font-size: 1.6rem; animation-delay: 3.5s; }

        /* ===== Animaciones ===== */
        @keyframes rebote {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes flotar {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        @keyframes brillar {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
            }

            h1 {
                font-size: 1.7rem;
            }

            .gato,
            .estrella {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>

    <!-- Decoraciones -->
    <span class="gato gato1">🐈</span>
    <span class="gato gato2">🐈‍⬛</span>
    <span class="gato gato3">🐱</span>

    <span class="estrella estrella1">✦</span>
    <span class="estrella estrella2">✧</span>
    <span class="estrella estrella3">✦</span>


    <!-- Contenido -->
    <div class="card">

        <div class="gatito">
            🐱
        </div>

        <h1>Holaaaaaaaaa</h1>

        <p>
            Soy Natalie Landero
        </p>

        <p>
            Me gusta viajar, los gatos y los videojuegos c:
        </p>



    </div>

</body>

</html>
