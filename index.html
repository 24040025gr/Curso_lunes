<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wellington</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg), #1e293b);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
  }
  .card {
    background: var(--card);
    padding: 3rem 4rem;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
  }
  h1 {
    font-size: 2.5rem;
    letter-spacing: 1px;
  }
  h1 span {
    color: var(--accent);
  }
  p {
    margin-top: 0.75rem;
    color: var(--muted);
    font-size: 1rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Hola, soy <span>Wellington</span></h1>
    <p>Desarrollador · rh.gestion</p>
  </div>
</body>
</html>
