<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexia Liz</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e7, #f8c8dc, #e8d5f5);
            font-family: Arial, sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.65);
            padding: 70px 100px;
            border-radius: 35px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(180, 100, 150, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        h1 {
            margin: 0;
            font-size: 75px;
            color: #c4457c;
            letter-spacing: 5px;
            text-shadow: 3px 3px 8px #ffffff;
        }

        p {
            margin-top: 20px;
            font-size: 22px;
            color: #8d526f;
            letter-spacing: 2px;
        }

        .heart {
            font-size: 35px;
            color: #e75480;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="heart">✦ ♥ ✦ </div>

        <h1>Lizbeth Alexia Gaona Montenegro</h1>

        <p>Bienvenida a mi página ♡</p>

        <div class="heart">✦ ♥ ✦</div>
    </div>

</body>
</html>
